name: Draft release
description: Create a draft GitHub release for the current tag with every installer found in a directory

inputs:
  directory:
    description: Folder holding the downloaded installers
    required: true
  token:
    description: Token allowed to create releases
    required: true

runs:
  using: composite
  steps:
    - run: |
        find "${{ inputs.directory }}" -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" -o -name "*.deb" -o -name "*.rpm" \) -print0 \
          | xargs -0 gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --generate-notes --title "Block52 ${GITHUB_REF_NAME}"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
