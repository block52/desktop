name: Setup
description: Install Node and the yarn dependencies (frozen lockfile)

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --frozen-lockfile
      shell: bash
