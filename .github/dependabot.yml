version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns: ["@electron-forge/*"]
      testing:
        patterns: ["vitest", "@testing-library/*", "jsdom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must bump together — CodeQL fails if two steps in the
      # same workflow run different versions (#93/#94 each failed alone).
      codeql-action:
        patterns: ["github/codeql-action*"]
