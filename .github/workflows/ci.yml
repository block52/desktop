name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn test

  # Compiles the main process, preload and renderer and packages the app (no installer), so a broken build is caught on the PR.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn package

  # Reports known vulnerabilities in production dependencies; informational, never blocks a merge.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # yarn 1.x has no --exclude, so we parse the JSON and ignore specific advisory ids ourselves.
      # Known advisories with no action available to us (reinstate by removing the id once upstream ships a fix):
      #   1247710  picomatch ReDoS — no patch exists upstream (dev tooling: micromatch/anymatch)
      #   1243066  zod memory exhaustion — fixed in >=4.6.6, but @reown/appkit-wallet pins zod 3.x; cannot bump
      - run: |
          # Report everything for visibility.
          yarn audit --groups dependencies || true
          # Fail only on NEW moderate+ advisories (not the known-unfixable ids above).
          yarn audit --groups dependencies --json | node .github/scripts/audit-gate.mjs 1247710 1243066
