name: Cut release

# One-click release: bumps the version in package.json, commits it to main, tags it, and starts the
# installer build (release.yml) for that tag, which drafts the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Bump version, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(node -p "require('./package.json').version")"
          next="$(node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const bump = process.argv[2];
            const next = bump === "major" ? [major + 1, 0, 0] : bump === "minor" ? [major, minor + 1, 0] : [major, minor, patch + 1];
            process.stdout.write(next.join("."));
          ' "$current" "$BUMP")"
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "Tag v${next} already exists" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const pkg = fs.readFileSync("package.json", "utf8");
            fs.writeFileSync("package.json", pkg.replace(/("version":\s*")[^"]+(")/, `$1${process.argv[1]}$2`));
          ' "$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${next}"
          git tag "v${next}"
          git push origin main "v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't start other workflows, so start the build explicitly.
      - name: Start the installer build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run release.yml --ref "v${VERSION}"
