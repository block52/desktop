name: Release

# Builds the macOS, Windows and Linux installers.
#   - push a tag like v1.0.1 (must match package.json "version") to build and draft a GitHub release
#   - or run it manually from the Actions tab to build the installers as downloadable artifacts only
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: yarn lint
      - run: yarn test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    env:
      VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
      VITE_INDEXER_URL: ${{ vars.VITE_INDEXER_URL }}
      VITE_PAYMENT_PROXY_URL: ${{ vars.VITE_PAYMENT_PROXY_URL }}
      VITE_SNG_SCHEDULE_URL: ${{ vars.VITE_SNG_SCHEDULE_URL }}
      VITE_TREASURY_WALLET_ADDRESS: ${{ vars.VITE_TREASURY_WALLET_ADDRESS }}
      VITE_MAINNET_RPC_URL: ${{ secrets.VITE_MAINNET_RPC_URL }}
      VITE_PROFILE_NFT_INDEXER_URL: ${{ vars.VITE_PROFILE_NFT_INDEXER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packaging tools (deb, rpm)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packaging-tools
      - uses: ./.github/actions/setup
      - run: yarn make
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - uses: ./.github/actions/draft-release
        with:
          directory: installers
          token: ${{ github.token }}
