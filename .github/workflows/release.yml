name: Release

# Builds the macOS, Windows and Linux installers.
#   - push a tag like v1.0.1 (must match package.json "version") to build and draft a GitHub release
#   - or run it manually from the Actions tab to build the installers as downloadable artifacts only
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Go wallet sidecar tests
        working-directory: sidecar
        run: go test ./...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            # Not ubuntu-latest (26.04): its rpm (4.20+) runs %install in a per-package build folder, and the spec
            # template in electron-installer-redhat (3.4.0, and still 4.0.0) copies `usr/*` relative to the old one,
            # so the .rpm fails with "cp: cannot stat 'usr/*'". 24.04's rpm still uses the old layout. Move back to
            # ubuntu-latest once electron-installer-redhat handles rpm 4.20.
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    # Holds the release secret. Protect it under Settings > Environments > release (required reviewers, and
    # deployment branches/tags limited to main and v*), then store VITE_MAINNET_RPC_URL as an environment secret.
    environment: release
    env:
      VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
      VITE_INDEXER_URL: ${{ vars.VITE_INDEXER_URL }}
      # A secret, not a variable: injected into the build for indexer GraphQL search (#49).
      VITE_INDEXER_API_KEY: ${{ secrets.INDEXER_API_KEY }}
      VITE_SNG_SCHEDULE_URL: ${{ vars.VITE_SNG_SCHEDULE_URL }}
      VITE_TREASURY_WALLET_ADDRESS: ${{ vars.VITE_TREASURY_WALLET_ADDRESS }}
      VITE_PROFILE_NFT_INDEXER_URL: ${{ vars.VITE_PROFILE_NFT_INDEXER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux packaging tools (deb, rpm)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packaging-tools
      - uses: ./.github/actions/setup
      # yarn make builds the Go wallet sidecar for this runner's platform (b52-wallet.exe on Windows).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      # Only the build step sees the secret; dependency install scripts run without it.
      - run: yarn make
        env:
          VITE_MAINNET_RPC_URL: ${{ secrets.VITE_MAINNET_RPC_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.name }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - uses: ./.github/actions/draft-release
        with:
          directory: installers
          token: ${{ github.token }}
